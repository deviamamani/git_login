<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat Inteligente - Devia Mamani</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center p-4">

    <!-- TARJETA PRINCIPAL -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-200">

        <!-- ENCABEZADO -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6">

            <div class="flex items-center gap-3">

                <span class="w-3 h-3 bg-green-400 rounded-full animate-pulse"></span>

                <h1 class="text-2xl font-bold">
                    Chat Inteligente -- Devia
                </h1>

            </div>

            <p class="text-sm mt-2 text-indigo-100">
                Asistente virtual de Tecnología
            </p>

        </div>


        <!-- INFORMACIÓN -->
        <div class="p-6">

            <div class="bg-indigo-50 rounded-xl p-5 mb-5">

                <h2 class="text-xl font-bold text-indigo-700">
                    👩‍💻 Devia Mamani
                </h2>

                <p class="text-slate-600 mt-2">
                    Bienvenida a mi asistente virtual
                </p>

            </div>


            <!-- MENSAJE DEL BOT -->
            <div class="bg-slate-50 border-l-4 border-purple-500 rounded-lg p-5 mb-6">

                <p class="text-slate-700 italic">
                    ¡Hola! Soy el asistente virtual de Devia.
                    ¿En qué puedo ayudarte?
                </p>

            </div>


            <!-- TEMAS -->
            <p class="font-bold text-slate-700 mb-3">
                Puedes preguntarme sobre:
            </p>

            <div class="grid grid-cols-2 gap-3 mb-6">

                <button onclick="ponerPregunta('¿Qué es la programación?')"
                    class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 p-3 rounded-lg">
                    💻 Programación
                </button>

                <button onclick="ponerPregunta('¿Qué es una base de datos?')"
                    class="bg-purple-100 hover:bg-purple-200 text-purple-700 p-3 rounded-lg">
                    🗄️ Bases de datos
                </button>

                <button onclick="ponerPregunta('¿Qué es Git y GitHub?')"
                    class="bg-pink-100 hover:bg-pink-200 text-pink-700 p-3 rounded-lg">
                    🔗 Git y GitHub
                </button>

                <button onclick="ponerPregunta('¿Qué es la tecnología?')"
                    class="bg-blue-100 hover:bg-blue-200 text-blue-700 p-3 rounded-lg">
                    🌐 Tecnología
                </button>

            </div>


            <!-- CONSULTA -->
            <label class="block text-sm font-bold text-slate-600 mb-2">
                TU CONSULTA:
            </label>

            <textarea
                id="consulta"
                rows="4"
                placeholder="Escribe aquí tu pregunta..."
                class="w-full border border-slate-300 rounded-lg p-4 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none"></textarea>


            <!-- BOTÓN -->
            <button
                onclick="responder()"
                class="w-full mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition duration-300">

                🚀 Enviar consulta

            </button>


            <!-- RESPUESTA -->
            <div id="respuesta" class="hidden mt-6">

                <p class="text-sm font-bold text-slate-600 mb-2">
                    RESPUESTA:
                </p>

                <div class="bg-indigo-50 border-l-4 border-indigo-500 rounded-lg p-5">

                    <p id="textoRespuesta" class="text-slate-700"></p>

                </div>

            </div>

        </div>


        <!-- PIE DE PÁGINA -->
        <div class="bg-slate-100 text-center py-4">

            <p class="font-semibold text-slate-600">
                Devia Mamani
            </p>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script>

        function ponerPregunta(pregunta) {

            document.getElementById("consulta").value = pregunta;

        }


        function responder() {

            const consulta =
                document.getElementById("consulta").value.trim();

            const respuesta =
                document.getElementById("respuesta");

            const textoRespuesta =
                document.getElementById("textoRespuesta");


            if (consulta === "") {

                alert("Por favor, escribe una pregunta.");

                return;

            }


            let mensaje = "Gracias por tu pregunta. ";


            if (consulta.toLowerCase().includes("programación")) {

                mensaje +=
                    "La programación es el proceso de crear instrucciones para que una computadora pueda realizar determinadas tareas.";

            }

            else if (consulta.toLowerCase().includes("base de datos")) {

                mensaje +=
                    "Una base de datos permite almacenar, organizar y consultar información de manera estructurada.";

            }

            else if (
                consulta.toLowerCase().includes("git") ||
                consulta.toLowerCase().includes("github")
            ) {

                mensaje +=
                    "Git es un sistema de control de versiones y GitHub es una plataforma para almacenar y compartir proyectos.";

            }

            else if (consulta.toLowerCase().includes("tecnología")) {

                mensaje +=
                    "La tecnología comprende herramientas, conocimientos y técnicas utilizadas para resolver problemas y facilitar diferentes actividades.";

            }

            else {

                mensaje +=
                    "Soy el asistente virtual de Devia y puedo ayudarte con temas relacionados con tecnología y computación.";

            }


            textoRespuesta.textContent = mensaje;

            respuesta.classList.remove("hidden");

        }

    </script>

</body>
</html>
